name: Site check

on:
  schedule:
    # Asked for every 10 minutes — NOT because the site needs watching that often, but because
    # GitHub keeps only a fraction of the slots it is given. Measured on 2026-09-17, the repository's
    # first day: of 14 scheduled runs due on the previous "7,37" (every 30 min) cron, exactly ONE
    # ran, and that one 28 minutes late. Asking six times an hour is how you get a check an hour.
    # Minutes are offset off :00 and :30, which is when GitHub's queue is most congested.
    #
    # This does NOT guarantee anything: we do not control GitHub's scheduler, and a dropped run is
    # invisible from inside. That is what the gap report in src/rules.mjs `judgeCoverage` is for —
    # every run says how long the site actually went unwatched, and a DOWN email carries it too.
    #
    # ⚠️ This repository is PUBLIC, so standard runners cost no Actions minutes. If it is ever made
    # private, LOWER THIS FIRST — at 6 runs/hour it would eat the organisation's free 2,000 minutes
    # in days, and the platform's production deploy shares them (see README, "Actions minutes").
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      accept_articles:
        description: "An article was removed on purpose: take today's sitemap as the new baseline"
        type: boolean
        default: false

# Never let two checks write the state at the same time.
concurrency:
  group: site-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # The state (was the site down last time, which articles existed) lives in the Actions cache.
      # Cache entries are immutable, so each run saves under a new key and the next run restores the
      # newest one by prefix.
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: site-state-${{ github.run_id }}
          restore-keys: site-state-

      - name: Check the site
        id: check
        continue-on-error: true
        env:
          ACCEPT_ARTICLES: ${{ inputs.accept_articles && 'true' || 'false' }}
          # Chrome is preinstalled on GitHub's Ubuntu runners; check.mjs finds it.
        run: node src/check.mjs

      - name: Email on a change
        if: always() && hashFiles('result.json') != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/notify.mjs

      - name: Save state
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: site-state-${{ github.run_id }}

      # A red run is the second signal: GitHub emails a failed scheduled run to whoever last changed
      # the schedule. It stays red on every run while the site is down.
      - name: Fail the run when the site is down
        if: steps.check.outcome != 'success'
        run: |
          echo "The site check failed; see the step summary for what is wrong."
          exit 1
