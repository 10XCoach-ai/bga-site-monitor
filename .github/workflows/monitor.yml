name: Site check

on:
  schedule:
    # The cron no longer paces the checking — it only STARTS a long-running job that then checks
    # every ~10 minutes on its own (see src/watch.mjs). GitHub drops most scheduled runs: measured
    # 2026-09-18, of ~84 due slots on the previous every-10-minutes cron only 4 fired, ~one check
    # every 2–4.5 hours. A dense cron does not fix that; a job that watches itself does. We keep the
    # cron dense anyway so that, at any moment, a fresh run is queued as a warm standby ready to take
    # over the instant the running job ends — `concurrency` below keeps exactly one such standby.
    #
    # ⚠️ This repository is PUBLIC, so standard runners cost no Actions minutes. If it is ever made
    # private, the long-running job would consume them continuously — DO NOT run this design private
    # without rethinking it; the platform's production deploy shares the org's 2,000 free minutes.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      accept_articles:
        description: "An article was removed on purpose: take today's sitemap as the new baseline"
        type: boolean
        default: false
      prove_alerts:
        description: "Prove the alert emails actually arrive (sends one DOWN and one RECOVERED, to ALERT_TO)"
        type: boolean
        default: false
      loop_minutes:
        description: "Run the watcher as a short loop for this many minutes (0 = a single check). Uses an isolated state; does not disturb the real monitor."
        type: string
        default: "0"
      check_every_minutes:
        description: "Gap between checks when loop_minutes > 0 (manual proof runs only)."
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.prove_alerts }}
    runs-on: ubuntu-latest
    # A scheduled run keeps ONE job checking for ~5.5 h (below GitHub's 6 h hard limit); watch.mjs
    # stops itself first so the "save state" step always runs. timeout-minutes is only a backstop.
    timeout-minutes: 350
    # Scheduled runs share one group, so exactly one watcher runs and exactly one waits as a warm
    # standby (GitHub keeps a single pending run per group and cancels older pending ones). We do NOT
    # cancel-in-progress: a new cron firing must not kill the running watcher, or its state would
    # never be saved. Manual runs get a unique group so a proof run never queues behind the watcher.
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'site-check' || format('site-check-manual-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      # Scheduled = watch for ~5.5 h, every 10 min, against the real cached state.
      # Manual = one check (loop_minutes 0) or a short isolated loop for proving the mechanism.
      MAX_RUN_MINUTES: ${{ github.event_name == 'schedule' && '330' || inputs.loop_minutes }}
      CHECK_EVERY_MINUTES: ${{ github.event_name == 'schedule' && '10' || inputs.check_every_minutes }}
      STATE_FILE: ${{ github.event_name == 'schedule' && 'state/state.json' || 'manual/state.json' }}
      RESULT_FILE: ${{ github.event_name == 'schedule' && 'result.json' || 'manual/result.json' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # The state (was the site down last time, which articles existed, when it was last checked)
      # lives in the Actions cache between jobs. Only scheduled runs read and write it; a manual proof
      # run keeps its own isolated state under manual/ and never touches this.
      - name: Restore last state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: site-state-${{ github.run_id }}
          restore-keys: site-state-

      # One job, many checks. watch.mjs runs src/check.mjs then src/notify.mjs every CHECK_EVERY_MINUTES
      # until MAX_RUN_MINUTES, emailing only on a change. continue-on-error so a DOWN site (exit 1)
      # does not skip the state-save below; the real red/green is set by the final step.
      - name: Watch the site
        id: watch
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ACCEPT_ARTICLES: ${{ inputs.accept_articles && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Chrome is preinstalled on GitHub's Ubuntu runners; check.mjs finds it.
        run: node src/watch.mjs

      - name: Save state
        if: always() && github.event_name == 'schedule' && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: site-state-${{ github.run_id }}

      # The second signal: a red run. GitHub emails a failed scheduled run to whoever last touched the
      # workflow, and it stays red for as long as the last check in the job saw the site down.
      - name: Fail the run when the site is down
        if: steps.watch.outcome != 'success'
        run: |
          echo "The last check in this job saw the site down; see the step summary."
          exit 1

  # Proves the whole alert chain end-to-end: a real failing check, the real composeEmail, the real
  # Resend call, to the real ALERT_TO. Run it by hand after changing the key, the sender domain or
  # the recipient — a present RESEND_API_KEY is NOT evidence that mail arrives.
  #
  # It cannot disturb the monitor: it never touches the Actions cache, so the real "was the site
  # down, which articles existed" state is neither read nor written. It keeps its own throwaway
  # state under proof/ and the runner is destroyed afterwards.
  prove:
    if: ${{ inputs.prove_alerts }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # A host that does not resolve. Every page fails, so the check reports DOWN for real —
      # nothing is faked, and the email is composed by the same code a true outage would use.
      - name: "1/2 · a failing site, from no previous state → expect a DOWN email"
        env:
          SITE_URL: https://monitor-proof-no-such-host.businessgrowth-alliance.com
          STATE_FILE: proof/state.json
          RESULT_FILE: proof/result.json
          RETRY_DELAY_MS: "0"
        run: node src/check.mjs || true

      - name: "1/2 · send it"
        env:
          RESULT_FILE: proof/result.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/notify.mjs

      # Same throwaway state, now remembering "down", pointed back at the real site.
      - name: "2/2 · the real site, from that down state → expect a RECOVERED email"
        env:
          STATE_FILE: proof/state.json
          RESULT_FILE: proof/result.json
          RETRY_DELAY_MS: "0"
        run: node src/check.mjs

      - name: "2/2 · send it"
        env:
          RESULT_FILE: proof/result.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/notify.mjs

      - name: What this proved
        run: |
          echo "Two emails were attempted to ALERT_TO: one DOWN, one RECOVERED."
          echo "If both arrived, the key, the sender domain and the recipient are all good."
          echo "The monitor's own state was never read or written: no cache step runs in this job."
