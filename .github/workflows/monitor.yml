name: Site check

on:
  schedule:
    # Asked for every 10 minutes — NOT because the site needs watching that often, but because
    # GitHub keeps only a fraction of the slots it is given. Measured on 2026-09-17, the repository's
    # first day: of 14 scheduled runs due on the previous "7,37" (every 30 min) cron, exactly ONE
    # ran, and that one 28 minutes late. Asking six times an hour is how you get a check an hour.
    # Minutes are offset off :00 and :30, which is when GitHub's queue is most congested.
    #
    # This does NOT guarantee anything: we do not control GitHub's scheduler, and a dropped run is
    # invisible from inside. That is what the gap report in src/rules.mjs `judgeCoverage` is for —
    # every run says how long the site actually went unwatched, and a DOWN email carries it too.
    #
    # ⚠️ This repository is PUBLIC, so standard runners cost no Actions minutes. If it is ever made
    # private, LOWER THIS FIRST — at 6 runs/hour it would eat the organisation's free 2,000 minutes
    # in days, and the platform's production deploy shares them (see README, "Actions minutes").
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      accept_articles:
        description: "An article was removed on purpose: take today's sitemap as the new baseline"
        type: boolean
        default: false
      prove_alerts:
        description: "Prove the alert emails actually arrive (sends one DOWN and one RECOVERED, to ALERT_TO)"
        type: boolean
        default: false

# Never let two checks write the state at the same time.
concurrency:
  group: site-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.prove_alerts }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # The state (was the site down last time, which articles existed) lives in the Actions cache.
      # Cache entries are immutable, so each run saves under a new key and the next run restores the
      # newest one by prefix.
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: site-state-${{ github.run_id }}
          restore-keys: site-state-

      - name: Check the site
        id: check
        continue-on-error: true
        env:
          ACCEPT_ARTICLES: ${{ inputs.accept_articles && 'true' || 'false' }}
          # Chrome is preinstalled on GitHub's Ubuntu runners; check.mjs finds it.
        run: node src/check.mjs

      - name: Email on a change
        if: always() && hashFiles('result.json') != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/notify.mjs

      - name: Save state
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: site-state-${{ github.run_id }}

      # A red run is the second signal: GitHub emails a failed scheduled run to whoever last changed
      # the schedule. It stays red on every run while the site is down.
      - name: Fail the run when the site is down
        if: steps.check.outcome != 'success'
        run: |
          echo "The site check failed; see the step summary for what is wrong."
          exit 1

  # Proves the whole alert chain end-to-end: a real failing check, the real composeEmail, the real
  # Resend call, to the real ALERT_TO. Run it by hand after changing the key, the sender domain or
  # the recipient — a present RESEND_API_KEY is NOT evidence that mail arrives.
  #
  # It cannot disturb the monitor: it never touches the Actions cache, so the real "was the site
  # down, which articles existed" state is neither read nor written. It keeps its own throwaway
  # state under proof/ and the runner is destroyed afterwards.
  prove:
    if: ${{ inputs.prove_alerts }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # A host that does not resolve. Every page fails, so the check reports DOWN for real —
      # nothing is faked, and the email is composed by the same code a true outage would use.
      - name: "1/2 · a failing site, from no previous state → expect a DOWN email"
        env:
          SITE_URL: https://monitor-proof-no-such-host.businessgrowth-alliance.com
          STATE_FILE: proof/state.json
          RESULT_FILE: proof/result.json
          RETRY_DELAY_MS: "0"
        run: node src/check.mjs || true

      - name: "1/2 · send it"
        env:
          RESULT_FILE: proof/result.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/notify.mjs

      # Same throwaway state, now remembering "down", pointed back at the real site.
      - name: "2/2 · the real site, from that down state → expect a RECOVERED email"
        env:
          STATE_FILE: proof/state.json
          RESULT_FILE: proof/result.json
          RETRY_DELAY_MS: "0"
        run: node src/check.mjs

      - name: "2/2 · send it"
        env:
          RESULT_FILE: proof/result.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/notify.mjs

      - name: What this proved
        run: |
          echo "Two emails were attempted to ALERT_TO: one DOWN, one RECOVERED."
          echo "If both arrived, the key, the sender domain and the recipient are all good."
          echo "The monitor's own state was never read or written: no cache step runs in this job."
